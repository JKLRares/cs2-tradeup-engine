name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.configuration }}${{ matrix.sanitizers == 'ON' && ' ASan-UBSan' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            sanitizers: 'OFF'
          - configuration: Release
            sanitizers: 'OFF'
          - configuration: Debug
            sanitizers: 'ON'
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DTRADEUP_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DTRADEUP_REQUIRE_PYTHON=ON
          -DTRADEUP_BUILD_BENCHMARKS=${{ matrix.configuration == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows UCRT64 ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DTRADEUP_REQUIRE_PYTHON=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
